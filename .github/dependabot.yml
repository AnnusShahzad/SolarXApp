version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-and-agp:
        patterns: ["org.jetbrains.kotlin*", "com.android*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
